<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FINOVA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@500;600;700&display=swap">
<style>
/* Layout: sidebar navy + contenido en tarjetas planas; barra inferior en celular. Superficies por escalón de color, no por sombra. */
:root{
  --navy:#101D35; --green:#16A878; --green-soft:#DDF5EA; --green-ink:#0B7A57;
  --bg:#F5F7FA; --card:#FFFFFF; --card2:#EEF2F7; --fg:#101D35; --muted:#66758C; --line:#E2E8F0;
  --blue:#3979CF; --blue-ink:#2A62B0; --yellow:#F2B84B; --yellow-soft:#FCF0D5; --yellow-ink:#7A5200;
  --red:#E35D6A; --red-soft:#FBE4E7; --red-ink:#B03342; --blue-soft:#E3EEFB; --purple:#7A6AD8; --teal:#2BA3B5;
  --side:#101D35; --on-green:#0A1A2E; --overlay:rgba(10,20,40,.55);
  --r:16px; --r-sm:10px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --green:#2CC795; --green-soft:#123B33; --green-ink:#5FDDB0; --bg:#0A1325; --card:#131F38; --card2:#1B2A4A; --fg:#E8EDF5; --muted:#9DABC2; --line:#26365A;
  --blue:#6A9CE8; --blue-ink:#8FB6F2; --blue-soft:#1A2D52; --yellow:#F2B84B; --yellow-soft:#3A2F14; --yellow-ink:#F5CF86;
  --red:#F0808B; --red-soft:#432029; --red-ink:#F5A3AB; --purple:#9C8FEA; --teal:#4BC2D3; --side:#0B162B; --overlay:rgba(0,0,0,.65); color-scheme:dark}}
:root[data-theme="dark"]{
  --green:#2CC795; --green-soft:#123B33; --green-ink:#5FDDB0; --bg:#0A1325; --card:#131F38; --card2:#1B2A4A; --fg:#E8EDF5; --muted:#9DABC2; --line:#26365A;
  --blue:#6A9CE8; --blue-ink:#8FB6F2; --blue-soft:#1A2D52; --yellow:#F2B84B; --yellow-soft:#3A2F14; --yellow-ink:#F5CF86;
  --red:#F0808B; --red-soft:#432029; --red-ink:#F5A3AB; --purple:#9C8FEA; --teal:#4BC2D3; --side:#0B162B; --overlay:rgba(0,0,0,.65); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:80}
h1,h2,h3,h4,p{margin:0}
h1{font-size:26px;line-height:1.2;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:18px;letter-spacing:-.01em;text-wrap:balance}
h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:"IBM Plex Sans",Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .sm{font-size:12.5px} .xs{font-size:11.5px} .b{font-weight:600}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;gap:3px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 4px;font-weight:700;font-size:20px;letter-spacing:.04em}
.logo{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:var(--on-green);font-weight:800;font-size:16px;letter-spacing:0}
.slogan{font-size:11.5px;color:#9FB0CC;padding:0 10px 18px;line-height:1.4}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#B7C4DB;background:none;border:0;cursor:pointer;text-align:left;width:100%;font-weight:500;transition:background .2s,color .2s}
.nav:hover{background:rgba(255,255,255,.07);color:#fff}
.nav.on{background:var(--green);color:var(--on-green);font-weight:600}
.side hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:10px 0;width:100%}
.demo-note{margin-top:auto;font-size:11.5px;color:#9FB0CC;padding:12px;border-radius:12px;background:rgba(255,255,255,.06)}
.main{min-width:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);padding-block:12px;border-bottom:1px solid transparent}
.top .wrap{display:flex;align-items:center;gap:10px}
.searchbox{position:relative;flex:1;min-width:0;max-width:480px}
.searchbox input{width:100%;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);padding:0 14px 0 40px}
.searchbox .ico{position:absolute;left:12px;top:11px;color:var(--muted);pointer-events:none}
.results{position:absolute;top:48px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:14px;max-height:60vh;overflow:auto;z-index:50;padding:6px}
.results button{display:flex;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px;cursor:pointer;align-items:center}
.results button:hover{background:var(--card2)}
.ib{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer;position:relative;flex:none;transition:background .2s}
.ib:hover{background:var(--card2)}
.dot{position:absolute;top:8px;right:9px;min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;display:grid;place-items:center;font-weight:700;padding:0 4px}
.page{padding-block:8px 110px;display:flex;flex-direction:column;gap:20px;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.ph{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}
.ph p{color:var(--muted);margin-top:4px;max-width:62ch}
.card{background:var(--card);border-radius:var(--r);padding:20px;border:1px solid var(--line);min-width:0}
.card.flat{background:var(--card2);border-color:transparent}
.card.navy{background:var(--navy);color:#fff;border-color:transparent}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.kpi .l{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:6px}
.kpi .v{font-size:28px;font-weight:700;margin-top:6px;line-height:1.1}
.kpi .s{font-size:12.5px;margin-top:6px;color:var(--muted)}
.up{color:var(--green-ink)} .down{color:var(--red-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap;transition:transform .15s,background .2s}
.btn:hover{background:var(--card2)} .btn:active{transform:scale(.98)}
.btn.pri{background:var(--green);border-color:var(--green);color:var(--on-green)} .btn.pri:hover{filter:brightness(1.06)}
.btn.dng{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{height:32px;padding:0 11px;font-size:12.5px;border-radius:8px}
.btn.gh{background:none;border-color:transparent;color:var(--blue-ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld label{font-size:12.5px;font-weight:600;color:var(--muted)}
.fld input,.fld select,.fld textarea,.in{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:0 12px;width:100%;min-width:0}
.fld textarea{height:auto;padding:10px 12px;resize:vertical}
.fld input[type=range]{padding:0;height:28px;accent-color:var(--green)}
.err{color:var(--red-ink);font-size:12px} .hint{color:var(--muted);font-size:12px}
.fld input.bad,.fld select.bad{border-color:var(--red)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form .full{grid-column:1/-1}
.seg{display:inline-flex;background:var(--card2);padding:3px;border-radius:12px;gap:2px;flex-wrap:wrap;max-width:100%}
.seg button{border:0;background:none;padding:7px 13px;border-radius:9px;cursor:pointer;font-weight:600;color:var(--muted);min-height:34px}
.seg button.on{background:var(--card);color:var(--fg)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--line);background:var(--card);padding:8px 16px;border-radius:999px;cursor:pointer;font-weight:600;color:var(--muted);white-space:nowrap}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .tabs button.on{background:var(--green);color:var(--on-green);border-color:var(--green)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tabs button.on{background:var(--green);color:var(--on-green);border-color:var(--green)}}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--card2);color:var(--muted);white-space:nowrap}
.pill.g{background:var(--green-soft);color:var(--green-ink)} .pill.y{background:var(--yellow-soft);color:var(--yellow-ink)} .pill.r{background:var(--red-soft);color:var(--red-ink)} .pill.b{background:var(--blue-soft);color:var(--blue-ink)}
.demo{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:1px 7px;border-radius:6px;background:var(--yellow-soft);color:var(--yellow-ink);vertical-align:middle}
.bar{height:9px;border-radius:6px;background:var(--card2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--green);transition:width .5s ease}
.bar.y i{background:var(--yellow)} .bar.r i{background:var(--red)} .bar.b i{background:var(--blue)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--yellow-soft);color:var(--yellow-ink);font-size:13px}
.banner.r{background:var(--red-soft);color:var(--red-ink)} .banner.g{background:var(--green-soft);color:var(--green-ink)} .banner.b{background:var(--blue-soft);color:var(--blue-ink)}
.banner svg{flex:none;margin-top:2px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:12px;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;white-space:nowrap}
td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}
.empty{text-align:center;padding:36px 16px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg);font-size:15px}
.ov{position:fixed;inset:0;background:var(--overlay);z-index:90;display:grid;place-items:center;padding:16px;animation:fadeo .2s}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);border-radius:20px;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;border:1px solid var(--line);animation:pop .25s ease}
.modal.wide{width:min(820px,100%)}
@keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 0;gap:10px}
.mb{padding:16px 20px 20px;display:flex;flex-direction:column;gap:14px}
.mf{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;padding:0 16px}
@media(min-width:901px){.toasts{bottom:24px;left:248px}}
.toast{background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-weight:500;animation:pop .25s;max-width:100%;border:1px solid rgba(255,255,255,.15)}
.toast.ok{background:var(--green);color:var(--on-green)} .toast.err{background:var(--red);color:#fff}
.bottom{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--side);z-index:70;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-between}
.bottom button{flex:1;min-width:0;background:none;border:0;color:#9FB0CC;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;padding:6px 0;cursor:pointer;border-radius:10px;font-weight:500}
.bottom button.on{color:var(--green);font-weight:700}
.chat{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px}
.msgs{display:flex;flex-direction:column;gap:12px;min-height:360px;max-height:56vh;overflow:auto;padding:4px}
.msg{max-width:min(640px,92%);padding:12px 14px;border-radius:14px;line-height:1.55}
.msg.u{align-self:flex-end;background:var(--navy);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--card2);border-bottom-left-radius:4px}
.msg p+p,.msg ul{margin-top:8px} .msg ul{padding-left:18px;margin-bottom:0}
.chip{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;cursor:pointer;font-size:12.5px;font-weight:500}
.chip:hover{background:var(--card2)}
.chip.on{background:var(--green-soft);border-color:var(--green);color:var(--green-ink)}
.risk{display:inline-flex;gap:3px;vertical-align:middle}
.risk i{width:14px;height:6px;border-radius:3px;background:var(--line)} .risk i.on{background:var(--yellow)} .risk.hi i.on{background:var(--red)}
.path{display:flex;flex-direction:column;gap:18px;position:relative}
.lvl{display:flex;gap:16px;align-items:flex-start}
.node{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:20px;flex:none;background:var(--card2);color:var(--muted);border:3px solid var(--line)}
.node.done{background:var(--green);border-color:var(--green);color:var(--on-green)} .node.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:10px;flex:1;min-width:0}
.lesson{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--card);display:flex;flex-direction:column;gap:8px;text-align:left;cursor:pointer;transition:transform .15s,border-color .2s}
.lesson:hover:not([disabled]){transform:translateY(-2px);border-color:var(--green)}
.lesson[disabled]{opacity:.55;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal div{aspect-ratio:1;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-size:11.5px;color:var(--muted)}
.cal div.on{background:var(--green);color:var(--on-green);font-weight:700} .cal div.now{outline:2px solid var(--blue)}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--card);cursor:pointer;font-weight:500;margin-bottom:8px}
.opt:hover:not([disabled]){border-color:var(--blue)} .opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.ok{border-color:var(--green);background:var(--green-soft)} .opt.no{border-color:var(--red);background:var(--red-soft)}
.fb{padding:12px 14px;border-radius:12px} .fb.ok{background:var(--green-soft);color:var(--green-ink)} .fb.no{background:var(--red-soft);color:var(--red-ink)}
.badge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px;border-radius:14px;background:var(--card2);flex:1;min-width:130px}
.badge .ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:#3b2800}
.badge.lock{opacity:.6} .badge.lock .ic{background:var(--line);color:var(--muted)}
.rank{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--line)}
.rank.me{background:var(--green-soft);border-radius:10px;border-color:transparent}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.acc button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:14px 2px;cursor:pointer;font-weight:600}
.acc p{padding:0 2px 14px;color:var(--muted)}
.sw{position:relative;width:44px;height:26px;border-radius:13px;border:0;background:var(--line);cursor:pointer;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on{background:var(--green)} .sw.on::after{transform:translateX(18px)}
.step{display:flex;gap:6px;justify-content:center} .step i{width:8px;height:8px;border-radius:50%;background:var(--line)} .step i.on{background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)} .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
textarea.code{width:100%;height:220px;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;background:var(--card2);padding:10px}
.ni{display:flex;gap:10px;padding:10px;border-radius:12px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;cursor:pointer}
.ni:hover{background:var(--card2)} .ni.unread{background:var(--blue-soft)}
.notif{position:absolute;right:0;top:50px;width:min(380px,calc(100vw - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;max-height:70vh;overflow:auto;z-index:60}
.rel{position:relative}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)} .side{display:none} .bottom{display:flex}
  .split,.chat{grid-template-columns:minmax(0,1fr)} .form{grid-template-columns:1fr}
  h1{font-size:22px} .kpi .v{font-size:24px} .msgs{max-height:50vh}
  .lvl{gap:10px} .node{width:42px;height:42px;font-size:16px}
}
@media (max-width:900px){.hide-m{display:none}}
.sr{position:absolute;left:-9999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Botones claros sobre fondo marino (barra lateral y tarjeta de racha) */
.side .btn,.card.navy .btn{color:var(--fg)}
/* Entrada: perfiles y PIN */
.login{min-height:100vh;display:grid;place-items:center;padding:32px 16px;background:radial-gradient(1200px 500px at 50% -10%,var(--green-soft),transparent 70%),var(--bg)}
.login-in{width:100%;max-width:900px;display:flex;flex-direction:column;gap:26px;animation:fade .35s ease}
.login-brand{display:flex;align-items:center;gap:14px}
.login-name{font-size:24px;font-weight:800;letter-spacing:.05em}
.acc-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr))}
.acc{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:inherit;transition:transform .15s,border-color .15s,box-shadow .15s}
.acc:hover,.acc:focus-visible{transform:translateY(-2px);border-color:var(--green);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.acc-av{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:22px;background:var(--navy);color:#fff;flex:none}
.acc-new{border-style:dashed}.acc-new .acc-av{background:var(--green-soft);color:var(--green-ink)}
.acc-n{font-weight:700;font-size:16px}
.acc-pin{display:inline-flex;align-items:center;gap:4px}
.pin-card{max-width:460px;width:100%;gap:16px}
.pin-in{font-size:24px!important;letter-spacing:.5em;text-align:center}
.login-trust{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
.login-trust svg{flex:none;color:var(--green-ink);margin-top:1px}
/* Plan del hogar */
.stack{display:flex;height:36px;border-radius:10px;overflow:hidden;background:var(--card2)}
.stack i{display:block;height:100%;transition:width .3s}
.sw-dot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}

/* ================= PLAN DEL HOGAR =================
   Reproduce las hojas "Flujo de efectivo" y "Ahorro" del modelo final:
   lo que sobra cada mes paga primero la tarjeta y, ya liquidada, va al fondo de emergencia en CETES.
   Con recorte = 4,000 da los mismos resultados que el Excel (ver test/t5.js). */
const cetesNetoMensual=M=>(M.cetes.tasa-M.cetes.isr)/12;
function planHogar(M,recorte){
  const rc=cetesNetoMensual(M),rT=M.tarjeta.tasa/12,rP=M.prestamo.tasa/12;
  let tc=M.tarjeta.saldo,pn=M.prestamo.saldo,fondo=0,sinRend=0,intTc=0,deficit=null,mesTarjeta=null,mesPrestamo=null,mesMeta=null;
  const meses=[];
  for(let m=1;m<=24;m++){
    const y2=m>=M.mesAjuste,g=y2?1+M.crecimiento:1;
    const ingresoBase=M.ingreso*g,extra=(m===M.tanda.mesRecibe?M.tanda.recibe:0)+(m===M.isr.mes?M.isr.monto:0);
    const gc=M.gastoCorriente*g,sgmm=M.sgmm.anual/12*(y2?1+M.sgmm.alza:1),np=Math.max(0,M.noPlaneados-recorte);
    const tanda=m<=M.tanda.hasta?M.tanda.pago:0,ppr=m>=M.ppr.desde?M.ppr.mensual:0;
    let pagoPrestamo=0;
    if(pn>0){const i=pn*rP;pagoPrestamo=Math.min(M.prestamo.pago,pn+i);pn=pn+i-pagoPrestamo;if(pn<=0.005){pn=0;mesPrestamo=m}}
    const res=ingresoBase+extra-gc-sgmm-np-tanda-pagoPrestamo-ppr;
    let pagoTarjeta=0;
    if(tc>0){const i=tc*rT;intTc+=i;pagoTarjeta=Math.min(Math.max(res,0),tc+i);tc=tc+i-pagoTarjeta;if(tc<=0.005){tc=0;mesTarjeta=m}}
    const ahorro=res-pagoTarjeta;               // negativo = se toma del fondo
    fondo=fondo*(1+rc)+ahorro;sinRend+=ahorro;
    if(fondo<0){if(!deficit)deficit={mes:m,monto:-fondo};fondo=0;sinRend=Math.max(0,sinRend)}
    if(mesMeta===null&&fondo>=M.metaFondo)mesMeta=m;
    meses.push({m,ingreso:ingresoBase+extra,gastoCorriente:gc,sgmm,noPlaneados:np,tanda,prestamo:pagoPrestamo,tarjeta:pagoTarjeta,ppr,
      ahorro,fondo,sinRend,mesesCubre:fondo/gc});
  }
  return {meses,mesTarjeta,mesPrestamo,mesMeta,interesesTarjeta:intTc,deficit,deudaFinal:tc+pn};
}

/* Mejor tarjeta según el perfil, con el comparativo de Banxico del rango de límite.
   Paga el total → solo tarjetas sin anualidad, por menor CAT. Carga saldo → todas, por menor CAT.
   Entre las que están a 5 puntos de CAT de la más barata, prefiere la que coincide con el uso. */
function recomendarTarjeta({paga,rango,uso,actual}){
  const T=TARJETAS[rango]||TARJETAS['15000'];
  const filas=T.filas.map(([n,anual,cat,web,u],i)=>({n,anual,cat,web,uso:u,pos:i+1}));
  const pool=(paga?filas.filter(f=>f.anual===0):filas).slice().sort((a,b)=>a.cat-b.cat);
  const min=pool[0],top=pool.find(f=>f.uso===uso&&f.cat<=min.cat+5)||min;
  const otras=pool.filter(f=>f!==top).slice(0,2),act=actual?filas.find(f=>f.n===actual)||null:null;
  return {T,top,min,otras,act,total:filas.length};
}

/* Fondo de emergencia para cualquier cuenta: meta = 3 meses del gasto en necesidades del mes. */

  if(ent>0&&prev.length){const avg=sum(prev)/prev.length;const d=(ent-avg)/avg*100;if(Math.abs(d)>=5)out.push({k:d>0?'y':'g',t:`En entretenimiento gastaste ${fmt(ent)}, ${pc(Math.abs(d),0)} ${d>0?'más':'menos'} que tu promedio de los meses anteriores (${fmt(avg)}).`})}
  const we=sum(ex.filter(t=>[0,6].includes(pd(t.date).getDay())),t=>t.amount);
  if(T.exp>0)out.push({k:'b',t:`${pc(we/T.exp*100,0)} de tu gasto ocurre en fin de semana.`});
  const cr=sum(ex.filter(t=>t.method==='Crédito'),t=>t.amount);
  if(cr>0)out.push({k:cr/T.exp>.3?'y':'b',t:`Pagaste ${fmt(cr)} con tarjeta de crédito (${pc(cr/T.exp*100,0)} del gasto). ${cr/T.exp>.3?'Procura pagar el total para no generar intereses.':'Mantenerlo bajo ayuda a evitar intereses.'}`});
  const small=ex.filter(t=>t.amount<=300);
  if(small.length>=3)out.push({k:'b',t:`Tienes ${small.length} gastos de ${fmt(300)} o menos que suman ${fmt(sum(small,t=>t.amount))}. Los gastos pequeños también cuentan.`});
  const big=[...ex].sort((a,b)=>b.amount-a.amount)[0];
  out.push({k:'b',t:`Tu gasto individual más grande fue ${fmt(big.amount)} en ${big.cat}${big.note?' ('+big.note+')':''}, el ${fshort(big.date)}.`});
  const fx=sum(ex.filter(t=>(EXP_CATS.find(c=>c.n===t.cat)||{}).fixed),t=>t.amount);
  out.push({k:'b',t:`Tus gastos fijos son ${pc(fx/T.exp*100,0)} del total y los variables ${pc(100-fx/T.exp*100,0)}. Los variables son los que más puedes ajustar.`});
  return out;
}

/* ================= DEUDAS ================= */
function payoff(debts,extra,method){
  const ds=debts.map(d=>({...d,bal:d.balance}));
  const budget=sum(debts,d=>d.min)+extra;let month=0,interest=0;const series=[sum(ds,d=>d.bal)],order=[];
  while(ds.some(d=>d.bal>0.01)&&month<600){
    month++;
    ds.forEach(d=>{if(d.bal>0.01){const i=d.bal*d.rate/100/12;d.bal+=i;interest+=i}});
    let avail=budget;
    ds.forEach(d=>{if(d.bal>0.01){const p=Math.min(d.min,d.bal,avail);d.bal-=p;avail-=p}});
    const tg=ds.filter(d=>d.bal>0.01).sort(method==='avalancha'?(a,b)=>b.rate-a.rate:(a,b)=>a.bal-b.bal);
    for(const d of tg){if(avail<=0.001)break;const p=Math.min(avail,d.bal);d.bal-=p;avail-=p}
    ds.forEach(d=>{if(d.bal<=0.01&&!order.includes(d.name)){order.push(d.name);d.bal=0}});
    series.push(sum(ds,d=>d.bal));
  }
  return {months:month,interest,series,order,ok:!ds.some(d=>d.bal>0.01)};
}
const fmtMonths=m=>{const y=Math.floor(m/12),r=m%12;return (y?`${y} ${y===1?'año':'años'}`:'')+(y&&r?' y ':'')+(r||!y?`${r} ${r===1?'mes':'meses'}`:'')};

/* ================= INVERSIONES ================= */
function simPortfolio(p,delta=0){
  const months=Math.round(p.years*12),tw=sum(ASSET_IDS,i=>p.alloc[i]||0)/100,scale=tw>1?1/tw:1,cash=Math.max(0,1-tw);
  const w={},rm={},bal={};
  ASSET_IDS.forEach(id=>{w[id]=(p.alloc[id]||0)/100*scale;rm[id]=Math.pow(1+Math.max(-99,(p.rets[id]||0)+delta)/100,1/12)-1;bal[id]=p.capital*w[id]});
  let cb=p.capital*cash;const step=months<=24?1:months<=120?3:12;
  const pt=m=>({m,label:(m/12).toFixed(m%12?1:0),v:sum(ASSET_IDS,i=>bal[i])+cb,c:p.capital+p.monthly*m});
  const series=[pt(0)];
  for(let m=1;m<=months;m++){ASSET_IDS.forEach(id=>{bal[id]=bal[id]*(1+rm[id])+p.monthly*w[id]});cb+=p.monthly*cash;if(m%step===0||m===months)series.push(pt(m))}
  const final=sum(ASSET_IDS,i=>bal[i])+cb,contrib=p.capital+p.monthly*months;
  return {series,final,contrib,gain:final-contrib,per:ASSET_IDS.map(id=>({id,amt:p.capital*w[id],final:bal[id]})).filter(x=>x.amt>0||(p.alloc[x.id]||0)>0)};
}
function pmtNeeded(target,years,annual,initial=0){
  const n=Math.round(years*12),r=Math.pow(1+annual/100,1/12)-1,need=target-initial*Math.pow(1+r,n);
  if(need<=0)return 0;return r===0?need/n:need*r/(Math.pow(1+r,n)-1);
}
function divers(alloc){
  const t=sum(ASSET_IDS,i=>alloc[i]||0)||1,p=ASSET_IDS.map(i=>(alloc[i]||0)/t);
  const hhi=sum(p,x=>x*x),eff=1/hhi,max=Math.max(...p)*100,n=p.filter(x=>x>0.0001).length;
  const risk=sum(ASSET_IDS,(id)=>0)+ASSET_IDS.reduce((a,id,i)=>a+p[i]*ASSETS[i].risk,0);
  return {hhi,eff,max,n,risk,score:clamp((eff-1)/5*100,0,100),conc:max>60?['Alta','r']:max>40?['Media','y']:['Baja','g']};
}

/* ================= INDICADORES (DEMO) ================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hashS=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0};
const _hist={};
function history(ind){
  if(_hist[ind.id])return _hist[ind.id];
  const r=mulberry(hashS(ind.id)),N=1825,a=new Array(N);a[N-1]=ind.val;
  for(let i=N-1;i>0;i--)a[i-1]=Math.max(ind.val*.25,a[i]+(ind.val-a[i])*.004+(r()-.5)*2*ind.vol);
  return _hist[ind.id]=a;
}
function chartData(ind,rk){
  const a=history(ind),n=RANGES[rk],step=Math.ceil(n/60),out=[],now=new Date();
  for(let j=0;j<n;j+=step){const idx=a.length-n+j,d=addD(now,-(n-1-j));out.push({d:rk==='1A'||rk==='5A'?`${MES[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`:`${d.getDate()} ${MES[d.getMonth()]}`,v:+a[idx].toFixed(4)})}
  const last=out[out.length-1];if(last.v!==a[a.length-1])out.push({d:'hoy',v:a[a.length-1]});
  return out;
}
function fv(ind,v){
  if(ind.unit==='%')return nf(v,2)+'%';
  if(ind.id==='ipc')return nf(v,0);
  return (ind.id==='udi'?nf(v,4):nf(v,2));
}
function change(ind){
  const a=history(ind),now=a[a.length-1],prev=a[a.length-31];
  if(ind.unit==='%'){const d=now-prev;return {txt:`${d>=0?'+':''}${nf(d,2)} pts`,up:d>=0}}
  const d=(now-prev)/prev*100;return {txt:`${d>=0?'+':''}${nf(d,2)}%`,up:d>=0};
}

function goalInfo(g){

}

const ACC_KEY='finova_cuentas_v1',SES_KEY='finova_sesion',UKEY=id=>'finova_u_'+id;

const toHex=buf=>[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
async function hashPin(pin,salt){
  const txt=salt+':'+pin;
  if(window.crypto&&crypto.subtle){return toHex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt)))}
  // Respaldo solo para navegadores sin crypto.subtle (demo): hash no criptográfico.
  let h=5381;for(const ch of txt)h=((h<<5)+h+ch.charCodeAt(0))>>>0;return 'djb2-'+h.toString(16);
}
const newSalt=()=>{const a=new Uint8Array(16);(window.crypto||{getRandomValues:x=>x.map(()=>Math.random()*256|0)}).getRandomValues(a);return toHex(a)};
async function makePin(pin){if(!pin)return null;const salt=newSalt();return {salt,hash:await hashPin(pin,salt)}}
async function verifyPin(acc,pin){if(!acc.pin)return true;return (await hashPin(pin,acc.pin.salt))===acc.pin.hash}

  return seedFor(acc);
}

function rich(text){
  const bold=t=>t.split('**').map((p,i)=>i%2?html`<strong key=${i}>${p}</strong>`:p);
  const lines=String(text).split('\n'),out=[];let li=[];
  const flush=()=>{if(li.length){out.push(html`<ul key=${'u'+out.length}>${li.map((x,i)=>html`<li key=${i}>${bold(x)}</li>`)}</ul>`);li=[]}};
  lines.forEach((l,i)=>{if(l.startsWith('• '))li.push(l.slice(2));else{flush();if(l.trim())out.push(html`<p key=${i}>${bold(l)}</p>`)}});
  flush();return out;
}
async function copyText(t,toast){

}

function Presupuestos(){
  const {s,upd,toast}=useApp(),c=col();

    if(!Number.isFinite(incN)||incN<=0)return setEr('El ingreso mensual debe ser mayor que cero.');
    if(pn.some(x=>!Number.isFinite(x)||x<0))return setEr('Los porcentajes deben ser números de 0 o más.');

        <${Field} label="Gustos %" id="r-w"><input id="r-w" type="number" min="0" max="100" value=${rl.wants} onChange=${e=>setRl({...rl,wants:e.target.value})}/><//>
        <${Field} label="Ahorro %" id="r-s"><input id="r-s" type="number" min="0" max="100" value=${rl.save} onChange=${e=>setRl({...rl,save:e.target.value})}/><//></div>
      <div className="row sp"><span className=${'sm '+(Math.round(total*100)===10000?'up':'down')}>Suma: ${nf(Number.isFinite(total)?total:0,0)}%</span><button className="btn pri sm" onClick=${saveRule}>Guardar regla</button></div>

  const [f,setF]=useState(edit?{name:edit.name,target:String(edit.target),saved:String(edit.saved),deadline:edit.deadline}:{name:'',target:'',saved:'0',deadline:''});
  const [er,setEr]=useState({});
  const submit=e=>{
    e.preventDefault();const x={},t=num(f.target),sv=num(f.saved);
    if(!f.name.trim())x.name='Ponle un nombre a tu meta.';
    if(!Number.isFinite(t)||t<=0)x.target='El objetivo debe ser mayor que cero.';
    if(!Number.isFinite(sv)||sv<0)x.saved='Lo ahorrado no puede ser negativo.';else if(Number.isFinite(t)&&sv>t)x.saved='Lo ahorrado no puede superar el objetivo.';
    if(!validDate(f.deadline))x.deadline='Elige una fecha válida.';else if(f.deadline<=todayS())x.deadline='La fecha límite debe ser futura.';
    setEr(x);if(Object.keys(x).length)return;
    upd(d=>{const r={name:f.name.trim(),target:t,saved:sv,deadline:f.deadline};if(edit){const i=d.goals.findIndex(g=>g.id===edit.id);d.goals[i]={...d.goals[i],...r}}else d.goals.push({id:uid(),...r,demo:false})});
    toast(edit?'Meta actualizada':'Meta creada','ok');onClose();

  return html`<${Modal} title=${edit?'Editar meta':'Nueva meta de ahorro'} onClose=${onClose}><form className="form" onSubmit=${submit} noValidate>
    <${Field} label="Nombre" id="g-n" err=${er.name} cls="full"><input id="g-n" maxLength="50" className=${er.name?'bad':''} value=${f.name} onChange=${e=>setF({...f,name:e.target.value})} autoFocus/><//>

    <${Field} label="Fecha límite" id="g-d" err=${er.deadline} cls="full"><input id="g-d" type="date" min=${iso(addD(new Date(),1))} className=${er.deadline?'bad':''} value=${f.deadline} onChange=${e=>setF({...f,deadline:e.target.value})}/><//>
    <div className="mf full"><button type="button" className="btn" onClick=${onClose}>Cancelar</button><button className="btn pri">${edit?'Guardar':'Crear meta'}</button></div></form><//>`;

function Abono({g,onClose}){
  const {s,upd,toast}=useApp();const [v,setV]=useState(''),[er,setEr]=useState('');
  const bal=tot(s.tx).net-savedTotal(s),rem=g.target-g.saved,rec=goalInfo(g).rec;
  const go=e=>{e.preventDefault();const a=num(v);
    if(!Number.isFinite(a)||a<=0)return setEr('Escribe un monto mayor que cero.');
    if(a>rem+0.001)return setEr(`Solo faltan ${fmt(rem)} para completar la meta.`);
    if(a>bal+0.001)return setEr(`Tu saldo disponible es ${fmt(bal)}.`);
    upd(d=>{d.goals.find(x=>x.id===g.id).saved+=a});toast(`Abonaste ${fmt(a)} a "${g.name}"`,'ok');onClose()};

    <div className="muted sm">Faltan ${fmt(rem)} · Aportación recomendada: ${fmt(rec)} al mes · Saldo disponible: ${fmt(bal)}</div>
    <${Field} label="Monto a abonar" id="ab-v" err=${er}><input id="ab-v" type="number" min="0" className=${er?'bad':''} placeholder=${String(Math.round(rec))} value=${v} onChange=${e=>setV(e.target.value)} autoFocus/><//>

}

function PlanBasico(){

  const F=fondoBasico(s,am),T=F.T,max=Math.max(1000,Math.round((s.user.income||0)/100)*100);
  const items={gastoCorriente:T.exp,deudas:0,sgmm:0,tanda:0,noPlaneados:0,ppr:0,ahorro:T.inc-T.exp};
  const crear=()=>{const n=F.mesMeta||12,d=new Date();upd(x=>{x.goals.push({id:uid(),name:'Fondo de emergencia',target:F.meta,saved:0,deadline:iso(new Date(d.getFullYear(),d.getMonth()+n,Math.min(d.getDate(),28))),demo:false})});toast('Meta «Fondo de emergencia» creada','ok')};

    <div className="split">

        <div className="num" style=${{fontSize:28,fontWeight:700}}>${F.mesMeta===0?'¡Ya llegaste!':F.mesMeta?`${F.mesMeta} ${F.mesMeta===1?'mes':'meses'}`:'Más de 10 años'}</div>
        <div className="muted xs">Simulación con CETES 28 días ${pc(RIVERA.modelo.cetes.tasa*100,1)} menos ISR (supuesto de noviembre 2026). No es garantía.</div></div>

/* ================= AHORRO POR PLAZOS (M3) =================
   Horizontes del Diagnóstico final; cifras de planHogar() con el recorte del plan. */
function PlazosModelo({M}){
  const {go}=useApp();
  const P=useMemo(()=>planHogar(M,M.recortePlan),[]),f=m=>P.meses[m-1];
  const cetes=m=>m<1?0:f(m).fondo-f(m).sinRend;
  const ppr24=(RIVERA.resumen.find(r=>/PPR/.test(r.k))||{v:[0,0,0]}).v[2],ret=RIVERA.retiro.base;
  const h=(m,t,dato)=>({m,t,dato});
  const datos={
    corto:{meta:`Mes ${P.mesTarjeta}`,metaSub:`Tarjeta Azul BBVA liquidada · ${mesTxt(M,P.mesTarjeta)}`,
      hitos:[h(1,'Seguro médico para mamá e hijo',`${fmt(f(1).sgmm)} al mes`),h(P.mesTarjeta,'Tanda de $15,000 y tarjeta liquidada',`${fmt(P.interesesTarjeta)} de intereses`),h(12,'Fondo de emergencia',`${fmt(f(12).fondo)} · ${nf(f(12).mesesCubre,1)} meses`)],
      cetes:cetes(12)},
    mediano:{meta:`Mes ${P.mesMeta}`,metaSub:`Fondo de 3 meses (${fmt(M.metaFondo)}) · ${mesTxt(M,P.mesMeta)}`,
      hitos:[h(M.isr.mes,'Devolución de ISR al fondo',fmt(M.isr.monto)),h(P.mesPrestamo,'Préstamo de Nómina liquidado: cero deudas','$0 de deuda'),h(21,'Fondo de emergencia',`${fmt(f(21).fondo)} · ${nf(f(21).mesesCubre,1)} meses`)],
      cetes:cetes(21)-cetes(12)},
    largo:{meta:`${fmt(M.ppr.mensual)} al mes`,metaSub:`PPR de papá y mamá desde el mes ${M.ppr.desde} · ${mesTxt(M,M.ppr.desde)}`,
      hitos:[h(24,'PPR acumulado',fmt(ppr24)),h(null,'Ingreso al retiro, a los 65 años',`${fmt(ret.total)} al mes (${nf(ret.pct,0)} % del ingreso actual)`)],
      cetes:null}};
  return html`<div className="card col" style=${{gap:14}}>
    <div className="ch" style=${{marginBottom:0}}><div><h2>Ahorro por plazos</h2><div className="muted sm">El plan de la consultora en tres horizontes. Mes 1 = ${mesTxt(M,1)}.</div></div><span className="pill g">Plan de la consultora</span></div>
    <div className="grid g3">${RIVERA.plazos.map(p=>{const d=datos[p.k];return html`<div key=${p.k} className=${'card flat col plazo '+p.k} style=${{gap:10}}>
      <div className="row sp"><span className=${'pill '+(p.k==='corto'?'b':p.k==='mediano'?'y':'g')}>${p.nombre}</span><span className="muted xs">${mesCorto(M,p.desde)} – ${p.hasta?mesCorto(M,p.hasta):'65 años'}</span></div>
      <div><div className="b">${p.titulo}</div><div className="num" style=${{fontSize:26,fontWeight:700,lineHeight:1.2,marginTop:4}}>${d.meta}</div><div className="muted sm">${d.metaSub}</div></div>
      <div className="col" style=${{gap:6}}>${d.hitos.map((x,i)=>html`<div key=${i} className="row sm" style=${{gap:8,flexWrap:'nowrap',alignItems:'flex-start'}}><b className="m-chip">${x.m?`Mes ${x.m}`:'65 años'}</b><span style=${{flex:1}}>${x.t}<br/><span className="muted xs">${x.m?mesTxt(M,x.m)+' · ':''}${x.dato}</span></span></div>`)}</div>
      <div className="sm donde"><b>Instrumento: ${p.instrumento}.</b> <span className="muted">${p.porque}</span></div>
      ${d.cetes!=null?html`<div className="sm up">Los CETES le suman <b className="num">+${fmt(d.cetes)}</b> al fondo en este plazo.</div>`:html`<button className="btn gh sm" style=${{alignSelf:'flex-start',padding:0,height:24}} onClick=${()=>go('finanzas','hogar')}>Ver el plan mes a mes →</button>`}
    </div>`})}</div>
    <div className="muted xs">Fuente: ${RIVERA.fuente}; tasas: CETES 28 días ${pc(TASAS.cetes28,2)} (${TASAS.fuente.cetes}), menos ${pc(TASAS.isr,2)} de ISR. Proyección, no garantía.</div>
  </div>`;
}

}
const Paso=({n,t})=>html`<div className="row" style=${{gap:10,flexWrap:'nowrap'}}><span className="num-badge">${n}</span><h2>${t}</h2></div>`;
const Supuesto=({children})=>html`<div className="xs supuesto"><b>Supuesto:</b> ${children}</div>`;

    return html`<div className="card col asesor" id="as-seguro" style=${{gap:14}}>

      <div className="grid g3">

        <div className="col" style=${{gap:8}}><div className="row sp"><b className="sm">Si pasa un evento médico</b><${Seg} opts=${[['promedio','Evento promedio'],['cancer','Cáncer']]} val=${ev} on=${setEv} label="Evento"/></div>
          <div className="grid" style=${{gridTemplateColumns:'1fr 1fr',gap:10}}>

            <div className="card flat"><div className="muted xs">Con seguro pagan</div><div className="num up" style=${{fontSize:24,fontWeight:700}} id="ev-con">${fmt(con)}</div></div></div>

      </div>
      <div className="sm donde"><b>Por qué:</b> <span className="muted">${G.porque} Un evento promedio cuesta lo mismo que ${nf(costo===SGMM_REF.eventoPromedio?SGMM_REF.eventoPromedio/(G.netoMensual*12):SGMM_REF.cancer/(G.netoMensual*12),1)} años de prima neta.</span></div>
      <${Supuesto}>la prima es una estimación con datos de AMIS; hay que confirmar la cotización con Seguros Monterrey. Fuente de costos médicos: ${SGMM_REF.fuente}.<//>

  const tiene=s.user.sgmm,meses=s.user.income>0?SGMM_REF.eventoPromedio/s.user.income:0;

function aiCtx(s){
  const ml=monthList(s),T=tot(ml),bc=byCat(ml),top=Object.entries(bc).sort((a,b)=>b[1]-a[1])[0]||['—',0];
  const g=[...s.goals].sort((a,b)=>goalInfo(b).pct-goalInfo(a).pct)[0],hd=[...s.debts].sort((a,b)=>b.rate-a.rate)[0];
  const over=budgetRows(s).filter(r=>r.pct>100);
  return {name:shortName(s.user),T,bc,top,ent:bc['Entretenimiento']||0,rate:T.inc>0?T.net/T.inc*100:0,g,hd,over,income:s.user.income,debtTotal:sum(s.debts,d=>d.balance)};
}

function aiAnswer(q,s){
  const c=aiCtx(s),n=norm(q),li={principiante:0,intermedio:1,avanzado:2}[s.ai.level]||0;
  for(const [re,f] of TOPICS){if(re.test(n)){const r=f(c);return Array.isArray(r)?r[li]:r}}

}

function normalizeAlloc(a){
  const t=sum(ASSET_IDS,i=>a[i]||0);if(t<=0)return Object.fromEntries(ASSET_IDS.map((i,k)=>[i,k===0?100:0]));
  const o={};ASSET_IDS.forEach(i=>{o[i]=Math.floor((a[i]||0)/t*100)});
  const rest=100-sum(ASSET_IDS,i=>o[i]);const big=ASSET_IDS.reduce((m,i)=>(a[i]||0)>(a[m]||0)?i:m,ASSET_IDS[0]);o[big]+=rest;return o;
}

function MetaCalc(){
  const c=col();const [f,setF]=useState({target:'100000',years:'5',rate:'8',init:'0'});
  const t=num(f.target),y=num(f.years),r=num(f.rate),i0=num(f.init);
  const er={};
  if(!Number.isFinite(t)||t<=0)er.target='La meta debe ser mayor que cero.';
  if(!Number.isFinite(y)||y<=0||y>50)er.years='Escribe entre 1 y 50 años.';
  if(!Number.isFinite(r)||r<-20||r>60)er.rate='Escribe un rendimiento entre −20 y 60.';
  if(!Number.isFinite(i0)||i0<0)er.init='El monto inicial no puede ser negativo.';
  const ok=!Object.keys(er).length,pm=ok?pmtNeeded(t,y,r,i0):0,pm0=ok?pmtNeeded(t,y,0,i0):0;
  const sim=ok?simPortfolio({capital:i0,monthly:pm,years:y,alloc:{CETES:100},rets:{CETES:r}}):null;

function Player({lesson,daily,onClose}){
  const {s,upd,toast,go}=useApp();
  const n=lesson.ex.length;
  const [i,setI]=useState(daily?0:-1),[pick,setPick]=useState(null),[txt,setTxt]=useState(''),[res,setRes]=useState(null),[right,setRight]=useState(0),[gain,setGain]=useState(0),[er,setEr]=useState(''),done=useRef(false);
  const ex=lesson.ex[i],xk=e=>daily?e.id+'@'+todayS():e.id;
  const answered=ex&&(ex.t==='mc'||ex.t==='tf'?pick!==null:txt.trim()!=='');
  const check=()=>{
    if(!answered){setEr('Elige o escribe una respuesta.');return}
    let ok=false;
    if(ex.t==='mc'||ex.t==='tf')ok=pick===ex.a;
    else if(ex.t==='fill')ok=ex.a.some(a=>norm(a)===norm(txt));
    else{const v=num(txt);if(!Number.isFinite(v)){setEr('Escribe un número válido.');return}ok=Math.abs(v-ex.a)<=(ex.tol||0)+1e-9}
    setEr('');
    let g=0;
    upd(d=>{const A=d.academy;if(!A.days.includes(todayS()))A.days.push(todayS());if(ok&&!A.correct.includes(xk(ex))){A.correct.push(xk(ex));A.xp+=10;g=10}});
    if(ok&&!s.academy.correct.includes(xk(ex)))setGain(x=>x+10);
    if(ok)setRight(r=>r+1);
    setRes({ok});
  };
  const next=()=>{setRes(null);setPick(null);setTxt('');setEr('');setI(i+1)};
  const finished=i>=n;
  useEffect(()=>{
    if(!finished||done.current)return;done.current=true;
    const score=Math.round(right/n*100);
    upd(d=>{const A=d.academy;
      if(daily){A.daily[todayS()]=true;if(right>0)A.xp+=5}
      else{const first=!A.log.some(l=>l.lesson===lesson.id);A.log.push({lesson:lesson.id,date:todayS(),score});if(first){A.xp+=20;}}
      if(!A.days.includes(todayS()))A.days.push(todayS())});
    if(!daily&&!s.academy.log.some(l=>l.lesson===lesson.id))setGain(x=>x+20);
    if(daily&&right>0)setGain(x=>x+5);
  },[finished]);
  const correctText=!ex?'':ex.t==='mc'?ex.o[ex.a]:ex.t==='tf'?(ex.a?'Verdadero':'Falso'):ex.t==='fill'?ex.a[0]:String(ex.a);
  if(i===-1)return html`<${Modal} title=${lesson.title} onClose=${onClose}><p>${lesson.intro}</p><div className="muted sm">${n} ejercicios · +10 XP por cada acierto nuevo</div><div className="mf"><button className="btn" onClick=${onClose}>Cerrar</button><button className="btn pri" onClick=${()=>setI(0)}>Empezar</button></div><//>`;
  if(finished){const score=Math.round(right/n*100);return html`<${Modal} title=${daily?'Reto diario completado':'Lección completada'} onClose=${onClose}>
    <div style=${{textAlign:'center'}} className="col"><div style=${{color:'var(--yellow)'}}><${Ic} n="trophy" s=${54}/></div><div className="num" style=${{fontSize:34,fontWeight:700}}>${score}%</div><div className="muted">${right} de ${n} respuestas correctas</div>
      <div className="row" style=${{justifyContent:'center'}}><span className="pill y">+${gain} XP</span><span className="pill g">Racha: ${streakOf([...s.academy.days,todayS()])} días</span></div></div>
    ${!daily&&lesson.rel?html`<${Banner} k="b" ic="spark">Siguiente paso: pon en práctica lo aprendido.<//><button className="btn pri" onClick=${()=>{onClose();go(lesson.rel.route,lesson.rel.tab)}}>${lesson.rel.label}</button>`:null}
    <div className="mf"><button className="btn" onClick=${onClose}>Cerrar</button></div><//>`}
  return html`<${Modal} title=${lesson.title} onClose=${onClose}>
    <${Bar} v=${(i+(res?1:0))/n*100}/><div className="muted xs">Ejercicio ${i+1} de ${n}</div>
    <h3 style=${{fontSize:17,lineHeight:1.4}}>${ex.t==='fill'?ex.q.split('___').map((p,k,a)=>k<a.length-1?html`<span key=${k}>${p}<span style=${{borderBottom:'2px solid var(--blue)',padding:'0 18px'}}> </span></span>`:p):ex.q}</h3>
    <div>${ex.t==='mc'?ex.o.map((o,k)=>html`<button key=${k} className=${'opt '+(res?(k===ex.a?'ok':pick===k?'no':''):pick===k?'sel':'')} disabled=${!!res} onClick=${()=>{setPick(k);setEr('')}}>${o}</button>`)
      :ex.t==='tf'?[[true,'Verdadero'],[false,'Falso']].map(([v,l])=>html`<button key=${l} className=${'opt '+(res?(v===ex.a?'ok':pick===v?'no':''):pick===v?'sel':'')} disabled=${!!res} onClick=${()=>{setPick(v);setEr('')}}>${l}</button>`)
      :html`<div className="fld"><label htmlFor="ans">${ex.t==='num'?'Tu respuesta (número)':'Tu respuesta'}</label><input id="ans" type=${ex.t==='num'?'number':'text'} step="any" inputMode=${ex.t==='num'?'decimal':'text'} autoComplete="off" disabled=${!!res} value=${txt} onChange=${e=>{setTxt(e.target.value);setEr('')}} onKeyDown=${e=>{if(e.key==='Enter'&&!res)check()}} autoFocus/></div>`}</div>
    ${er?html`<div className="err" role="alert">${er}</div>`:null}
    ${res?html`<div className=${'fb '+(res.ok?'ok':'no')} role="status"><b>${res.ok?'¡Correcto!':'Casi.'}</b>${res.ok?'':` La respuesta es: ${correctText}.`}<div style=${{marginTop:4}}>${ex.why}</div></div>`:null}
    <div className="mf">${res?html`<button className="btn pri" onClick=${next}>${i+1<n?'Continuar':'Ver resultado'}</button>`:html`<button className="btn pri" onClick=${check}>Comprobar</button>`}</div><//>`;
}

  return html`<${Modal} title=${account.pin?'Cambiar o quitar PIN':'Agregar PIN'} onClose=${onClose}><form className="col" onSubmit=${save} noValidate>

/* ================= CALCULADORAS ================= */
function NumF({k,l,f,setF,id,err,step,suffix}){return html`<${Field} label=${l} id=${id} err=${err}><input id=${id} type="number" step=${step||'any'} className=${err?'bad':''} value=${f[k]} onChange=${e=>setF({...f,[k]:e.target.value})}/><//>`}
const Res=({l,v,big})=>html`<div className="card flat"><div className="muted xs">${l}</div><div className=${'num b'} style=${{fontSize:big?28:20}}>${v}</div></div>`;
function CalcSimple(){const [f,setF]=useState({c:'10000',r:'7',y:'3'});const c=num(f.c),r=num(f.r),y=num(f.y);const e={};
  if(!(c>0))e.c='Escribe un capital mayor que cero.';if(!(r>=0)||!Number.isFinite(r))e.r='Escribe una tasa de 0 o más.';if(!(y>0))e.y='Escribe un plazo mayor que cero.';const ok=!Object.keys(e).length,i=ok?c*r/100*y:0;
  return html`<div className="grid g2"><div className="card col"><${NumF} id="cs-c" k="c" l="Capital" f=${f} setF=${setF} err=${e.c}/><${NumF} id="cs-r" k="r" l="Tasa anual %" f=${f} setF=${setF} err=${e.r}/><${NumF} id="cs-y" k="y" l="Años" f=${f} setF=${setF} err=${e.y}/></div>
  <div className="card col">${ok?html`<${Res} big l="Interés ganado" v=${fmt2(i)}/><${Res} l="Total al final" v=${fmt2(c+i)}/><div className="muted xs">Interés simple = capital × tasa × tiempo.</div>`:html`<${Empty} title="Faltan datos" text="Corrige los campos marcados."/>`}</div></div>`}
function CalcComp(){const [f,setF]=useState({c:'10000',r:'8',y:'5',n:'12',a:'500'});const c=num(f.c),r=num(f.r),y=num(f.y),n=+f.n,a=num(f.a);const e={};
  if(!(c>=0)||!Number.isFinite(c))e.c='Escribe un capital de 0 o más.';if(!(r>=0)||!Number.isFinite(r))e.r='Escribe una tasa de 0 o más.';if(!(y>0))e.y='Escribe un plazo mayor que cero.';if(!(a>=0)||!Number.isFinite(a))e.a='Escribe una aportación de 0 o más.';
  const ok=!Object.keys(e).length;let tf=0,aport=0;if(ok){tf=c*Math.pow(1+r/100/n,n*y);const rm=Math.pow(1+r/100/n,n/12)-1;aport=a>0?(rm===0?a*12*y:a*(Math.pow(1+rm,12*y)-1)/rm):0}
  return html`<div className="grid g2"><div className="card col"><${NumF} id="cc-c" k="c" l="Capital inicial" f=${f} setF=${setF} err=${e.c}/><${NumF} id="cc-r" k="r" l="Tasa anual %" f=${f} setF=${setF} err=${e.r}/><${NumF} id="cc-y" k="y" l="Años" f=${f} setF=${setF} err=${e.y}/>
    <${Field} label="Capitalización" id="cc-n"><select id="cc-n" value=${f.n} onChange=${ev=>setF({...f,n:ev.target.value})}><option value="1">Anual</option><option value="2">Semestral</option><option value="4">Trimestral</option><option value="12">Mensual</option></select><//><${NumF} id="cc-a" k="a" l="Aportación mensual (opcional)" f=${f} setF=${setF} err=${e.a}/></div>
  <div className="card col">${ok?html`<${Res} big l="Valor final" v=${fmt2(tf+aport)}/><${Res} l="Aportaciones totales" v=${fmt2(c+a*12*y)}/><${Res} l="Intereses ganados" v=${fmt2(tf+aport-c-a*12*y)}/>`:html`<${Empty} title="Faltan datos" text="Corrige los campos marcados."/>`}<div className="muted xs">Resultado hipotético. No garantiza rendimientos.</div></div></div>`}
function CalcAhorro(){const [f,setF]=useState({t:'20000',m:'10',r:'7'});const t=num(f.t),m=num(f.m),r=num(f.r);const e={};
  if(!(t>0))e.t='La meta debe ser mayor que cero.';if(!(m>=1)||m>600)e.m='Escribe entre 1 y 600 meses.';if(!Number.isFinite(r)||r<0||r>60)e.r='Escribe una tasa entre 0 y 60.';const ok=!Object.keys(e).length,p=ok?pmtNeeded(t,m/12,r):0;
  return html`<div className="grid g2"><div className="card col"><${NumF} id="ca-t" k="t" l="Meta de ahorro" f=${f} setF=${setF} err=${e.t}/><${NumF} id="ca-m" k="m" l="Meses" f=${f} setF=${setF} err=${e.m}/><${NumF} id="ca-r" k="r" l="Rendimiento anual % (0 si no ganas)" f=${f} setF=${setF} err=${e.r}/></div>
  <div className="card col">${ok?html`<${Res} big l="Ahorro mensual necesario" v=${fmt2(p)}/><${Res} l="Aportarás en total" v=${fmt2(p*m)}/>`:html`<${Empty} title="Faltan datos" text="Corrige los campos marcados."/>`}</div></div>`}
function CalcInfl(){const [f,setF]=useState({a:'10000',i:'4',y:'10'});const a=num(f.a),i=num(f.i),y=num(f.y);const e={};
  if(!(a>0))e.a='Escribe un monto mayor que cero.';if(!Number.isFinite(i)||i<-10||i>100)e.i='Escribe una inflación entre −10 y 100.';if(!(y>0)||y>80)e.y='Escribe entre 1 y 80 años.';const ok=!Object.keys(e).length;
  return html`<div className="grid g2"><div className="card col"><${NumF} id="ci-a" k="a" l="Monto de hoy" f=${f} setF=${setF} err=${e.a}/><${NumF} id="ci-i" k="i" l="Inflación anual %" f=${f} setF=${setF} err=${e.i}/><${NumF} id="ci-y" k="y" l="Años" f=${f} setF=${setF} err=${e.y}/></div>
  <div className="card col">${ok?html`<${Res} big l=${`Lo que costará en ${f.y} años lo que hoy cuesta ${fmt(a)}`} v=${fmt(a*Math.pow(1+i/100,y))}/><${Res} l=${`Lo que valdrán ${fmt(a)} en poder de compra de hoy`} v=${fmt(a/Math.pow(1+i/100,y))}/><${Res} l="Poder adquisitivo perdido" v=${pc((1-1/Math.pow(1+i/100,y))*100)}/>`:html`<${Empty} title="Faltan datos" text="Corrige los campos marcados."/>`}</div></div>`}
function CalcDeuda(){const [f,setF]=useState({b:'8500',r:'42',p:'900'});const b=num(f.b),r=num(f.r),p=num(f.p);const e={};
  if(!(b>0))e.b='Escribe un saldo mayor que cero.';if(!Number.isFinite(r)||r<0||r>300)e.r='Escribe una tasa entre 0 y 300.';if(!(p>0))e.p='Escribe un pago mayor que cero.';const ok=!Object.keys(e).length;
  const rm=r/100/12,never=ok&&p<=b*rm+0.005,n=ok&&!never?(rm===0?b/p:-Math.log(1-rm*b/p)/Math.log(1+rm)):0;
  return html`<div className="grid g2"><div className="card col"><${NumF} id="cd-b" k="b" l="Saldo de la deuda" f=${f} setF=${setF} err=${e.b}/><${NumF} id="cd-r" k="r" l="Tasa anual %" f=${f} setF=${setF} err=${e.r}/><${NumF} id="cd-p" k="p" l="Pago mensual" f=${f} setF=${setF} err=${e.p}/></div>
  <div className="card col">${!ok?html`<${Empty} title="Faltan datos" text="Corrige los campos marcados."/>`:never?html`<${Banner} k="r" ic="warn">Con ${fmt(p)} al mes no alcanzas a cubrir ni los intereses (${fmt(b*rm)} al mes). Sube tu pago.<//>`:html`<${Res} big l="Tiempo para liquidar" v=${fmtMonths(Math.ceil(n))}/><${Res} l="Intereses totales" v=${fmt2(p*n-b)}/><${Res} l="Total pagado" v=${fmt2(p*n)}/>`}</div></div>`}
function Calculadoras(){
  const [t,setT]=useTab('calculadoras','simple');
  return html`<div className="page"><${Head} title="Calculadoras" sub="Herramientas rápidas para entender tus números. Resultados hipotéticos."/>
    <${Tabs} opts=${[['simple','Interés simple'],['comp','Interés compuesto'],['ahorro','Ahorro'],['infl','Inflación'],['deuda','Deuda']]} val=${t} on=${setT}/>
    ${t==='simple'?html`<${CalcSimple}/>`:t==='comp'?html`<${CalcComp}/>`:t==='ahorro'?html`<${CalcAhorro}/>`:t==='infl'?html`<${CalcInfl}/>`:html`<${CalcDeuda}/>`}</div>`;
}

const NAV=[['inicio','Inicio','Inicio','home'],['asesor','Mi asesor','Asesor','star'],['mexico','México hoy','México','globe'],['finanzas','Mis finanzas','Finanzas','wallet'],['asistente','Asistente IA','IA','chat'],['inversiones','Inversiones','Invertir','chart'],['academia','Academia','Academia','book'],['perfil','Perfil','Perfil','user']];

function App({account,logout,onAccountChange}){
  const [s,setS]=useState(()=>loadUserState(account)),[route,setRoute]=useState(()=>{const h=(location.hash||'').slice(1);return ROUTES[h]?h:'inicio'});
  const [hint,setHint]=useState(null),[toasts,setToasts]=useState([]),[txm,setTxm]=useState(null),[conf,setConf]=useState(null),[tut,setTut]=useState(false),[nOpen,setNOpen]=useState(false),[q,setQ]=useState(''),[,setTick]=useState(0);
  const first=useRef(true);
  const upd=f=>setS(p=>{const n=JSON.parse(JSON.stringify(p));f(n);return n});
  useEffect(()=>{saveUserState(account.id,s)},[s]);
  useEffect(()=>{if(first.current){first.current=false;applyTheme(s.user.theme);if(!s.user.tutorialDone)setTut(true)}},[]);
  useEffect(()=>{const mq=window.matchMedia('(prefers-color-scheme: dark)');const h=()=>setTick(t=>t+1);mq.addEventListener?mq.addEventListener('change',h):mq.addListener(h);
    const hc=()=>{const r=location.hash.slice(1);if(ROUTES[r])setRoute(r)};window.addEventListener('hashchange',hc);return()=>{window.removeEventListener('hashchange',hc)}},[]);
  const toast=(msg,kind)=>{const id=uid();setToasts(t=>[...t,{id,msg,kind}]);setTimeout(()=>setToasts(t=>t.filter(x=>x.id!==id)),2800)};
  const go=(r,tab)=>{if(!ROUTES[r])return;setRoute(r);setHint({route:r,tab,n:Date.now()});setNOpen(false);setQ('');try{history.replaceState(null,'','#'+r)}catch(e){}window.scrollTo(0,0)};
  const setTheme=t=>{applyTheme(t);upd(d=>{d.user.theme=t})};

  const deleteMe=()=>{deleteAccount(account.id);logout()};

  const eb=earnedBadges(s).join(',');
  useEffect(()=>{const have=s.academy.badges,neu=earnedBadges(s).filter(b=>!have.includes(b));
    if(neu.length){upd(d=>{neu.forEach(b=>{d.academy.badges.push(b);d.academy.xp+=25})});neu.forEach(b=>toast(`Insignia: ${BADGES.find(x=>x.id===b).name} (+25 XP)`,'ok'))}},[eb]);
  const ctx={s,upd,toast,go,hint,openTx:(d)=>setTxm({defType:typeof d==='string'?d:undefined}),ask:setConf,reset,setTheme,replayTutorial:()=>setTut(true),account,logout,deleteMe,onAccountChange};
  const Page=ROUTES[route];
  const notifs=notifications(s),unread=notifs.filter(n=>!s.notifRead.includes(n.id));
  const results=useMemo(()=>{
    const k=norm(q);if(k.length<2)return [];const out=[];const add=(ic,t,sub,fn)=>out.push({ic,t,sub,fn});
    Object.entries(ROUTE_NAMES).forEach(([r,n])=>{if(norm(n).includes(k))add('home',n,'Sección',()=>go(r))});
    s.tx.filter(t=>norm(t.cat+' '+(t.note||'')).includes(k)).slice(0,4).forEach(t=>add('wallet',`${t.cat}: ${fmt(t.amount)}`,`${t.type==='gasto'?'Gasto':'Ingreso'} · ${fdate(t.date)}`,()=>go('finanzas','movimientos')));
    s.goals.filter(g=>norm(g.name).includes(k)).forEach(g=>add('flag',g.name,'Meta',()=>go('finanzas','metas')));
    s.debts.filter(g=>norm(g.name).includes(k)).forEach(g=>add('trend',g.name,'Deuda',()=>go('finanzas','deudas')));
    IND.filter(i=>norm(i.name).includes(k)).forEach(i=>add('globe',i.name,'Indicador (demo)',()=>go('mexico')));
    ASSETS.filter(a=>norm(a.name+' '+a.desc).includes(k)).forEach(a=>add('chart',a.name,'Instrumento',()=>go('inversiones','catalogo')));
    ALL_LESSONS.filter(l=>norm(l.title).includes(k)).forEach(l=>add('book',l.title,'Lección',()=>go('academia')));
    FAQ.filter(([a,b])=>norm(a+b).includes(k)).slice(0,3).forEach(([a])=>add('help',a,'Ayuda',()=>go('ayuda')));
    return out.slice(0,10);
  },[q,s.tx,s.goals,s.debts]);
  const readAll=()=>upd(d=>{d.notifRead=[...new Set([...d.notifRead,...notifs.map(n=>n.id)])]});
  const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  return html`<${Ctx.Provider} value=${ctx}>

        </div></header>

      </div>
    </div>
    <nav className="bottom" aria-label="Navegación principal">${NAV.filter(([r])=>r!=='mexico').map(([r,,l,ic])=>html`<button key=${r} className=${route===r?'on':''} aria-current=${route===r?'page':undefined} onClick=${()=>go(r)}><${Ic} n=${ic} s=${22}/>${l}</button>`)}</nav>
    <div className="toasts" aria-live="polite">${toasts.map(t=>html`<div key=${t.id} className=${'toast '+(t.kind||'')}>${t.msg}</div>`)}</div>
    ${txm?html`<${TxForm} defType=${txm.defType} onClose=${()=>setTxm(null)}/>`:null}

    ${tut?html`<${Tutorial} onClose=${()=>{setTut(false);upd(d=>{d.user.tutorialDone=true})}}/>`:null}
  <//>`;
}
/* Raíz: sin sesión muestra la entrada; con sesión monta la app de esa cuenta. */
function Root(){
  const [acc,setAcc]=useState(null),[ready,setReady]=useState(false);
  useEffect(()=>{ensureDefaults().then(a=>{const x=a.find(y=>y.id===getSession());if(x)setAcc(x);setReady(true)})},[]);
  const enter=a=>{setSession(a.id);setAcc(a);try{history.replaceState(null,'','#inicio')}catch(e){}window.scrollTo(0,0)};
  const logout=()=>{setSession(null);setAcc(null);applyTheme('auto');window.scrollTo(0,0)};
  if(!ready)return null;
  return acc?html`<${App} key=${acc.id} account=${acc} logout=${logout} onAccountChange=${setAcc}/>`:html`<${Login} onEnter=${enter}/>`;
}
if(!window.React||!window.ReactDOM||!window.Recharts||!window.htm){document.getElementById('root').textContent='No se pudieron cargar las bibliotecas de la demostración. Recarga la página.'}
else ReactDOM.createRoot(document.getElementById('root')).render(html`<${Root}/>`);
})();
